[project]
name = "the-lucky-house"
version = "1.0.0"
description = "THE LUCKY HOUSE - Rental Management System"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.1",
    "werkzeug==3.1.3",
    "python-dotenv==1.1.0",
    "flask-sqlalchemy==3.1.1",
    "flask-migrate==4.1.0",
    "psycopg2-binary==2.9.12",
    "flask-login==0.6.3",
    "waitress==3.0.2",
]

[dependency-groups]
dev = [
    "black",
    "ipython",
    "pytest",
    "ruff",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
