{% extends "base.html" %}
{% block title %}Sửa phòng - THE LUCKY HOUSE{% endblock %}
{% block page_title %}Sửa phòng {{ room.full_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
    <div class="card-header">
        <h2><i class="bi bi-door-open"></i> {{ room.full_name }}</h2>
        <span class="badge badge-{{ room.status_color }}">{{ room.status_label }}</span>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Diện tích (m²)</label>
                    <input type="number" step="0.5" name="area" class="form-control" value="{{ room.area }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Giá thuê (₫/tháng) *</label>
                    <input type="number" name="base_price" class="form-control" value="{{ room.base_price }}" required step="100000">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Số người tối đa</label>
                    <input type="number" name="max_occupants" class="form-control" value="{{ room.max_occupants }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Trạng thái</label>
                    <select name="status" class="form-control">
                        <option value="available" {% if room.status == 'available' %}selected{% endif %}>Trống</option>
                        <option value="occupied" {% if room.status == 'occupied' %}selected{% endif %}>Đang thuê</option>
                        <option value="maintenance" {% if room.status == 'maintenance' %}selected{% endif %}>Bảo trì</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Mô tả</label>
                <textarea name="description" class="form-control">{{ room.description or '' }}</textarea>
            </div>
            <div class="d-flex gap-8">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Cập nhật</button>
                <a href="{{ url_for('rooms.index') }}" class="btn btn-outline">Hủy</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
