{% extends "base.html" %}
{% block title %}{{ 'Sửa' if service else 'Thêm' }} dịch vụ - THE LUCKY HOUSE{% endblock %}
{% block page_title %}{{ 'Sửa dịch vụ' if service else 'Thêm dịch vụ mới' }}{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Tên dịch vụ *</label>
                <input type="text" name="name" class="form-control" value="{{ service.name if service else '' }}" placeholder="VD: Tiền điện, Tiền nước..." required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Đơn vị</label>
                    <input type="text" name="unit" class="form-control" value="{{ service.unit if service else '' }}" placeholder="VD: kWh, m³, tháng">
                </div>
                <div class="form-group">
                    <label class="form-label">Đơn giá (₫) *</label>
                    <input type="number" name="unit_price" class="form-control" value="{{ service.unit_price if service else '' }}" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Cách tính</label>
                <select name="calc_type" class="form-control">
                    <option value="per_unit" {% if service and service.calc_type == 'per_unit' %}selected{% endif %}>Theo đơn vị (chỉ số cũ/mới)</option>
                    <option value="fixed" {% if service and service.calc_type == 'fixed' %}selected{% endif %}>Cố định hàng tháng</option>
                </select>
            </div>
            {% if service %}
            <div class="form-group">
                <label class="form-label"><input type="checkbox" name="is_active" {% if service.is_active %}checked{% endif %}> Đang hoạt động</label>
            </div>
            {% endif %}
            <div class="d-flex gap-8">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> {{ 'Cập nhật' if service else 'Thêm mới' }}</button>
                <a href="{{ url_for('services.index') }}" class="btn btn-outline">Hủy</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
